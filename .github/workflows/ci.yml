name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      genesisdb:
        image: genesisdb/genesisdb:latest
        env:
          GENESISDB_AUTH_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
        env:
          GENESISDB_URL: http://localhost:8080
          GENESISDB_AUTH_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - run: dotnet pack GenesisDB.Client -c Release --no-build -o artifacts
